<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" rx="18" fill="#0e1622"/>
  <!-- TV -->
  <rect x="60" y="34" width="840" height="452" rx="14" fill="#1b2533" stroke="#3a4a60" stroke-width="3"/>
  <rect x="78" y="52" width="804" height="416" rx="6" fill="#20262e"/>
  <rect x="440" y="486" width="80" height="18" fill="#3a4a60"/>
  <rect x="380" y="504" width="200" height="10" rx="5" fill="#3a4a60"/>
  <!-- Encabezado -->
  <text x="110" y="100" font-size="30" font-weight="700" fill="#ffffff">Developer Mode</text>
  <text x="110" y="128" font-size="15" fill="#9aa6b5">LG webOS · ilustración: los datos de tu TV serán otros</text>
  <line x1="110" y1="146" x2="850" y2="146" stroke="#3a4450"/>
  <!-- Filas -->
  <g font-size="20">
    <text x="110" y="190" fill="#cfd6df">Dev Mode Status</text>
    <rect x="690" y="168" width="70" height="30" rx="15" fill="#c91923"/><circle cx="745" cy="183" r="11" fill="#fff"/>
    <text x="772" y="191" font-size="16" fill="#fff" font-weight="700">ON</text>

    <text x="110" y="240" fill="#cfd6df">Remaining Time</text>
    <text x="520" y="240" fill="#ffffff" font-family="Consolas, monospace">49:58:10</text>
    <rect x="690" y="216" width="120" height="34" rx="6" fill="#3d4652"/>
    <text x="750" y="239" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">EXTEND</text>

    <rect x="98" y="262" width="760" height="44" rx="8" fill="#2a3f5c"/>
    <text x="110" y="291" fill="#ffffff" font-weight="700">IP</text>
    <text x="520" y="291" fill="#ffffff" font-family="Consolas, monospace" font-weight="700">192.168.1.50</text>

    <rect x="98" y="314" width="760" height="44" rx="8" fill="#2a3f5c"/>
    <text x="110" y="343" fill="#ffffff" font-weight="700">Passphrase</text>
    <text x="520" y="343" fill="#ffffff" font-family="Consolas, monospace" font-weight="700">ABC123</text>

    <rect x="98" y="366" width="760" height="44" rx="8" fill="#2a3f5c"/>
    <text x="110" y="395" fill="#ffffff" font-weight="700">Key Server</text>
    <rect x="690" y="373" width="70" height="30" rx="15" fill="#c91923"/><circle cx="745" cy="388" r="11" fill="#fff"/>
    <text x="772" y="396" font-size="16" fill="#fff" font-weight="700">ON</text>
  </g>
  <!-- Marcas -->
  <g font-size="18" font-weight="800" text-anchor="middle" fill="#fff">
    <circle cx="880" cy="284" r="17" fill="#e8a317"/><text x="880" y="290">1</text>
    <circle cx="880" cy="336" r="17" fill="#e8a317"/><text x="880" y="342">2</text>
    <circle cx="880" cy="388" r="17" fill="#e8a317"/><text x="880" y="394">3</text>
  </g>
  <text x="480" y="544" font-size="17" fill="#e6ebf1" text-anchor="middle">1 = IP del TV   ·   2 = clave (Passphrase)   ·   3 = Key Server en ON</text>
</svg>
